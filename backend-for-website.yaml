apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-for-website
data:
  config.local.yaml: |
    services:
      identity: "http://identity:8080"
      auth: "http://auth:8080"
      music_catalog: "http://music-catalog:8080"
      social: "http://social:8080"

    auth:
      access_token_expiration_time: 15min
      refresh_token_expiration_time: 168h
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-for-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-for-website
  template:
    metadata:
      labels:
        app: backend-for-website
    spec:
      containers:
      - name: backend-for-website-container
        image: graphophone-backend-for-website:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
        volumeMounts:
        - name: config-volume
          mountPath: /config/config.local.yaml
          subPath: config.local.yaml
      volumes:
      - name: config-volume
        configMap:
          name: backend-for-website
---
apiVersion: v1
kind: Service
metadata:
  name: backend-for-website
spec:
  selector:
    app: backend-for-website
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
