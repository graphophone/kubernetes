apiVersion: v1
kind: ConfigMap
metadata:
  name: identity
data:
  config.local.toml: |
    [postgres]
    host = "postgres"
    port = 5432
    user = "postgres"
    password = "postgres123"
    database = "identity_db"

    [rustfs]
    access_key = "rustfsadmin"
    secret_key = "rustfsadmin"
    endpoint_url="http://rustfs:9000"
    deployed_url = "http://localhost:9000"
    region="eu-west-1"
    assets_bucket = "user-assets"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity
  template:
    metadata:
      labels:
        app: identity
    spec:
      containers:
      - name: identity-container
        image: graphophone-identity:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
        volumeMounts:
        - name: config-volume
          mountPath: /config/config.local.toml
          subPath: config.local.toml
      volumes:
      - name: config-volume
        configMap:
          name: identity
---
apiVersion: v1
kind: Service
metadata:
  name: identity
spec:
  selector:
    app: identity
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
