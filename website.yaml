apiVersion: v1
kind: ConfigMap
metadata:
  name: website
data:
  .env: |
    API_INTERNAL_URL="http://backend-for-website:8080"
    NEXT_PUBLIC_INTERNAL_ASSETS_URL="http://rustfs:9000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      containers:
      - name: website-container
        image: graphophone-website:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 30
        volumeMounts:
        - name: config-volume
          mountPath: /app/.env
          subPath: .env
      volumes:
      - name: config-volume
        configMap:
          name: website
---
apiVersion: v1
kind: Service
metadata:
  name: website
spec:
  type: LoadBalancer
  selector:
    app: website
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
