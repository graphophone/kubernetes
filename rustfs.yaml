apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  selector:
    app: rustfs
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
spec:
  serviceName: "rustfs"
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      initContainers:
      - name: volume-permissions
        image: alpine
        command: ["sh", "-c", "chown -R 10001:10001 /data /logs && echo 'Permissions fixed'"]
        volumeMounts:
        - name: rustfs-data
          mountPath: /data
        - name: rustfs-logs
          mountPath: /logs
      containers:
      - name: rustfs
        image: rustfs/rustfs:1.0.0-rc.3
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
        env:
        - name: RUSTFS_VOLUMES
          value: "/data/rustfs0"
        - name: RUSTFS_ADDRESS
          value: "0.0.0.0:9000"
        - name: RUSTFS_CONSOLE_ENABLE
          value: "true"
        - name: RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS
          value: "*"
        - name: RUSTFS_ACCESS_KEY
          value: "rustfsadmin"
        - name: RUSTFS_SECRET_KEY
          value: "rustfsadmin"
        - name: RUSTFS_OBS_LOGGER_LEVEL
          value: "info"
        - name: RUSTFS_OBS_LOG_DIRECTORY
          value: "/logs"
        ports:
        - containerPort: 9000
        - containerPort: 9001
        livenessProbe:
          httpGet:
            path: /health
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
        volumeMounts:
        - name: rustfs-data
          mountPath: /data
        - name: rustfs-logs
          mountPath: /logs
  volumeClaimTemplates:
  - metadata:
      name: rustfs-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
  - metadata:
      name: rustfs-logs
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-setup-buckets
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: aws-cli
        image: amazon/aws-cli:2.38.4
        env:
        - name: AWS_ACCESS_KEY_ID
          value: "rustfsadmin"
        - name: AWS_SECRET_ACCESS_KEY
          value: "rustfsadmin"
        - name: AWS_DEFAULT_REGION
          value: "eu-west-1"
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for rustfs to start..."
          until aws s3 ls --endpoint-url http://rustfs:9000 2>/dev/null; do
            sleep 2
          done
          
          echo "Rustfs is up. Creating buckets..."
          aws s3api create-bucket --bucket thumbnails --endpoint-url http://rustfs:9000
          aws s3api create-bucket --bucket raw-audio --endpoint-url http://rustfs:9000
          aws s3api create-bucket --bucket hls-audio --endpoint-url http://rustfs:9000
          aws s3api create-bucket --bucket user-assets --endpoint-url http://rustfs:9000
          
          echo "Applying policies..."
          cat > /tmp/thumbnails-policy.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "PublicReadObjects",
                "Effect": "Allow",
                "Principal": "*",
                "Action": ["s3:GetObject"],
                "Resource": ["arn:aws:s3:::thumbnails/*"]
              }
            ]
          }
          EOF
          aws s3api put-bucket-policy --bucket thumbnails --policy file:///tmp/thumbnails-policy.json --endpoint-url http://rustfs:9000

          cat > /tmp/user-assets-policy.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "PublicReadObjects",
                "Effect": "Allow",
                "Principal": "*",
                "Action": ["s3:GetObject"],
                "Resource": ["arn:aws:s3:::user-assets/*"]
              }
            ]
          }
          EOF
          aws s3api put-bucket-policy --bucket user-assets --policy file:///tmp/user-assets-policy.json --endpoint-url http://rustfs:9000
          
          cat > /tmp/streaming-audio-policy.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "PublicReadObjects",
                "Effect": "Allow",
                "Principal": "*",
                "Action": ["s3:GetObject"],
                "Resource": ["arn:aws:s3:::streaming-audio/*"]
              }
            ]
          }
          EOF
          aws s3api put-bucket-policy --bucket streaming-audio --policy file:///tmp/streaming-audio-policy.json --endpoint-url http://rustfs:9000
