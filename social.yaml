apiVersion: v1
kind: ConfigMap
metadata:
  name: social
data:
  config.local.yaml: |
    database:
      host: postgres
      port: 5432
      username: postgres
      password: postgres123
      database: social_db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: social
spec:
  replicas: 1
  selector:
    matchLabels:
      app: social
  template:
    metadata:
      labels:
        app: social
    spec:
      containers:
      - name: social-container
        image: graphophone-social:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
        volumeMounts:
        - name: config-volume
          mountPath: /config/config.local.yaml
          subPath: config.local.yaml
      volumes:
      - name: config-volume
        configMap:
          name: social
---
apiVersion: v1
kind: Service
metadata:
  name: social
spec:
  selector:
    app: social
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
